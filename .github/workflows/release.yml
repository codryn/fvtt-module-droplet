name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
      - name: Verify versions
        run: node -e "const p=require('./package.json');const m=require('./static/module.json');if(p.version!==m.version||process.env.GITHUB_REF_NAME!==('v'+p.version))process.exit(1)"
      - run: cd dist && zip -r ../droplet.zip .
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: droplet.zip